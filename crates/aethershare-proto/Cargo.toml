[package]
name = "aethershare-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0"
base64 = "0.23"
bytes = "1.10"
hkdf = "0.13"
num-bigint = "0.5"
once_cell = "1.20"
p256 = { version = "0.14", features = ["ecdh", "getrandom"] }
prost = "0.14"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.11"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.1"
