[package]
name = "aethershare-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
bluer = { version = "0.17", features = ["bluetoothd", "l2cap", "rfcomm"], optional = true }
dbus = { version = "0.9", features = ["vendored"] }

[dependencies]
aethershare-proto = { path = "../aethershare-proto" }
anyhow = "1.0"
base64 = "0.23"
btleplug = { version = "0.13", optional = true }
bytes = "1.10"
directories = "6.0"
futures = "0.3"
get_if_addrs = "0.5"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
libaes = "0.7"
log = "0.4"
mdns-sd = { git = "https://github.com/Martichou/mdns-sd", branch = "unsolicited" }
mime_guess = "2.0"
num-bigint = "0.5"
once_cell = "1.20"
p256 = { version = "0.14", features = ["ecdh", "getrandom"] }
prost = "0.14"
rand = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sys_metrics = { git = "https://github.com/Martichou/sys_metrics" }
tokio = { version = "1.43", features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "time",
    "io-util",
    "signal",
    "process",
] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = "1.15"

[features]
default = ["experimental"]
experimental = ["bluer", "btleplug"]
