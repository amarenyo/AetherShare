name: Release Linux Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional override tag (e.g. v0.2.0). Leave empty to use root VERSION file."
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Determine release tag and semver from VERSION
        id: meta
        shell: bash
        run: |
          CODE_VER=$(tr -d '[:space:]' < VERSION | sed 's/^[vV]//')
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            if [ "${VERSION}" != "${CODE_VER}" ]; then
              echo "::warning::Tag (${VERSION}) differs from VERSION file (${CODE_VER}); overriding VERSION in build to match tag."
            fi
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          else
            python3 scripts/sync-version.py --check
            VERSION="${CODE_VER}"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG} (version: ${VERSION})"

  build-deb-rpm-appimage:
    name: Build AppImage, DEB & RPM (x86_64)
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            protobuf-compiler \
            file \
            squashfs-tools \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/ui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds (workspace)
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace

      - name: Cache Rust builds (Tauri app)
        uses: Swatinem/rust-cache@v2
        with:
          key: tauri
          workspaces: app/src-tauri

      - name: Sync release version into VERSION & Tauri config
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          printf '%s\n' "${RELEASE_VERSION}" > VERSION
          python3 - <<'PY'
          import json, os
          p = "app/src-tauri/tauri.conf.json"
          with open(p, "r", encoding="utf-8") as f:
              cfg = json.load(f)
          cfg["version"] = os.environ["RELEASE_VERSION"]
          with open(p, "w", encoding="utf-8") as f:
              json.dump(cfg, f, indent=2)
              f.write("\n")
          PY

      - name: Install & build frontend UI
        working-directory: app/ui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Rust workspace tests
        run: cargo test --workspace --locked

      - name: Build CLI & embedded AWDL radio daemon (release)
        run: cargo build --release --locked -p aethershare-cli -p aethershare-awdld

      - name: Build AppImage, DEB & RPM bundles via Tauri CLI
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npx --yes @tauri-apps/cli@2 build --bundles deb,rpm,appimage

      - name: Collect bundles
        run: |
          mkdir -p dist-bundles
          cp -v app/src-tauri/target/release/bundle/appimage/*.AppImage dist-bundles/
          cp -v app/src-tauri/target/release/bundle/deb/*.deb dist-bundles/
          cp -v app/src-tauri/target/release/bundle/rpm/*.rpm dist-bundles/
          ls -lh dist-bundles/

      - name: Upload AppImage, DEB & RPM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-deb-rpm-appimage
          path: dist-bundles/*
          if-no-files-found: error

  build-arch:
    name: Build Arch Linux Package (.pkg.tar.zst)
    needs: resolve-version
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Arch Linux build dependencies
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            rust \
            nodejs \
            npm \
            protobuf \
            dbus \
            webkit2gtk-4.1 \
            gtk3 \
            libsoup3 \
            librsvg \
            libayatana-appindicator \
            bluez \
            networkmanager \
            polkit \
            git \
            tar \
            gzip

      - name: Build Arch package with makepkg
        env:
          RELEASE_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          printf '%s\n' "${RELEASE_VERSION}" > VERSION
          useradd -m builder
          mkdir -p /tmp/arch-build "AetherShare-${RELEASE_VERSION}"

          # Package current checkout into the source tarball expected by PKGBUILD
          tar \
            --exclude=".git" \
            --exclude="target" \
            --exclude="app/src-tauri/target" \
            --exclude="app/ui/node_modules" \
            --exclude="AetherShare-${RELEASE_VERSION}" \
            -cf - . | tar -xf - -C "AetherShare-${RELEASE_VERSION}"
          tar -czf "/tmp/arch-build/aethershare-${RELEASE_VERSION}.tar.gz" "AetherShare-${RELEASE_VERSION}"
          rm -rf "AetherShare-${RELEASE_VERSION}"

          cp app/packaging/arch/PKGBUILD /tmp/arch-build/PKGBUILD
          cp app/packaging/arch/aethershare.install /tmp/arch-build/aethershare.install
          sed -i "s/^pkgver=.*/pkgver=${RELEASE_VERSION}/" /tmp/arch-build/PKGBUILD
          chown -R builder:builder /tmp/arch-build

          su - builder -c "cd /tmp/arch-build && makepkg --noconfirm"

          mkdir -p dist-arch
          cp -v /tmp/arch-build/aethershare-*.pkg.tar.zst dist-arch/
          ls -lh dist-arch/

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-arch-pkg
          path: dist-arch/*.pkg.tar.zst
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - resolve-version
      - build-deb-rpm-appimage
      - build-arch
    runs-on: ubuntu-latest
    steps:
      - name: Download all built packages
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: AetherShare ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Linux Packages

            - **AppImage (universal):** Make executable (`chmod +x *.AppImage`) and run.
            - **Fedora / openSUSE / RHEL (`.rpm`):** `sudo dnf install ./AetherShare-*.rpm`
            - **Ubuntu / Debian / Mint (`.deb`):** `sudo apt install ./AetherShare_*.deb`
            - **Arch Linux / CachyOS / EndeavourOS (`.pkg.tar.zst`):** `sudo pacman -U ./aethershare-*.pkg.tar.zst`
          files: |
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.pkg.tar.zst
            release-assets/SHA256SUMS.txt
